name: Deploy Change For Good apps to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Pages site
        run: |
          mkdir -p _site
          cp -R faw-2026 _site/faw-2026
          cp -R reentry-housing _site/reentry-housing
          cp reentry-housing/mobile-app.html _site/reentry-housing/index.html
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change For Good Apps</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:720px;margin:40px auto;padding:20px;background:#f5f7fa;color:#182230}h1{margin-bottom:8px}.card{display:block;background:white;border:1px solid #d8e0ea;border-radius:16px;padding:18px;margin:14px 0;text-decoration:none;color:inherit}.card b{font-size:1.1rem}.card span{display:block;color:#667085;margin-top:5px}</style></head>
          <body><h1>Change For Good Apps</h1><p>Select an app.</p><a class="card" href="./reentry-housing/"><b>Valley Reentry Housing Navigator</b><span>Client intake, postal-code matching, Valley-wide housing search, case plans and notes.</span></a><a class="card" href="./reentry-housing/mapbox-3d.html"><b>3D Housing Area Viewer</b><span>Mapbox 3D housing and neighborhood viewer.</span></a><a class="card" href="./faw-2026/"><b>Fresno AIDS Walk Tracker</b><span>Fresno AIDS Walk project tracker.</span></a></body></html>
          EOF

      - name: Upload apps
        uses: actions/upload-pages-artifact@v4
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
