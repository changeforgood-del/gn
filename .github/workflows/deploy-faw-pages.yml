name: Deploy Change For Good apps to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Pages site
        run: |
          mkdir -p _site
          cp -R faw-2026 _site/faw-2026
          cp faw-2026/elite.html _site/faw-2026/index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('_site/faw-2026/index.html')
          master = Path('_site/faw-2026/master-data.js').read_text()
          s = p.read_text()
          s = s.replace("if(!f)return,r=new FileReader();", "if(!f)return;const r=new FileReader();")
          marker = '<script>\n' + master + '\n</script>\n<script src="./hand-controls.js?v=20260831-4"></script>\n<script src="./hand-controls-mobile.js?v=20260831-1"></script>\n'
          head, sep, tail = s.rpartition('</body>')
          if not sep:
              raise RuntimeError('Final </body> tag not found')
          s = head + marker + sep + tail
          s = s.replace('<head>', '<head>\n<meta name="faw-data-build" content="2026-08-31-full-master-v6-mobile-hand-controls">', 1)
          p.write_text(s)
          PY
          cp -R reentry-housing _site/reentry-housing
          cp reentry-housing/stop-autopilot.html _site/reentry-housing/index.html
          cp -R sociology-board-game _site/sociology-board-game
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change For Good Apps</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:720px;margin:40px auto;padding:20px;background:#f5f7fa;color:#182230}h1{margin-bottom:8px}.card{display:block;background:white;border:1px solid #d8e0ea;border-radius:16px;padding:18px;margin:14px 0;text-decoration:none;color:inherit}.card b{font-size:1.1rem}.card span{display:block;color:#667085;margin-top:5px}</style></head>
          <body><h1>Change For Good Apps</h1><p>Select an app.</p><a class="card" href="./reentry-housing/"><b>WestCare STOP Housing Autopilot</b><span>Housing navigation, regional search, outcomes and data quality.</span></a><a class="card" href="./reentry-housing/mapbox-3d.html"><b>3D Housing Area Viewer</b><span>3D housing and neighborhood viewer.</span></a><a class="card" href="./faw-2026/"><b>Fresno AIDS Walk Sponsorship Intelligence</b><span>Annual sponsorship CRM, clickable drilldowns, 3D data lab, contact research, committee ownership, forecasting and full exports.</span></a><a class="card" href="./sociology-board-game/"><b>The Social Ladder — 3D Sociology Game</b><span>Playable 3D board game about systems, choices, inequality, luck, and social location.</span></a></body></html>
          EOF

      - name: Upload apps
        uses: actions/upload-pages-artifact@v4
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
