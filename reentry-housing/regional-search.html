<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Valley Housing Search</title><style>:root{--navy:#123b63;--bg:#f6f8fb;--line:#d9e1e9;--muted:#667085;--green:#117a5b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:#17202a}.wrap{padding:12px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.field{flex:1;min-width:140px}label{display:block;font-size:.72rem;font-weight:800;color:#445366;margin-bottom:4px}input,select,button{font:inherit;border-radius:11px;min-height:44px}input,select{width:100%;border:1px solid #cbd5df;padding:10px;background:white}button{border:0;background:var(--navy);color:#fff;padding:10px 14px;font-weight:800}.sub{font-size:.75rem;color:var(--muted);margin:8px 0}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:.75rem}.stat b{font-size:1.15rem;display:block}.result{background:white;border:1px solid var(--line);border-radius:14px;padding:12px;margin:9px 0}.score{float:right;background:#e9f7f2;color:#08775a;border-radius:999px;padding:5px 8px;font-size:.7rem;font-weight:900}.pill{display:inline-block;background:#eef4ff;color:#294f83;border-radius:999px;padding:4px 7px;font-size:.68rem;font-weight:800;margin:3px 3px 0 0}.small{font-size:.76rem;color:var(--muted);line-height:1.45}.btnlink{display:inline-block;text-decoration:none;background:#eef2f6;color:#19324b;border-radius:10px;padding:8px 10px;font-size:.74rem;font-weight:800;margin-top:8px}.status{font-size:.78rem;color:#445366;margin:8px 0}</style></head><body><div class="wrap"><div class="bar"><div class="field"><label>Client primary ZIP</label><input id="zip" inputmode="numeric" maxlength="5" placeholder="93721"></div><div class="field"><label>Search coverage</label><select id="scope"><option value="client">Client area + nearby Valley cities</option><option value="all">All San Joaquin Valley hubs</option><option value="exact">Exact ZIP only</option></select></div><button id="run">Find Housing</button></div><div class="sub">Searches free HUD Multifamily, Public Housing and LIHTC datasets. Results are ranked by the active client profile and postal-code proximity.</div><div id="status" class="status">Ready.</div><div class="stats"><div class="stat"><b id="total">0</b>results</div><div class="stat"><b id="zips">0</b>ZIPs searched</div><div class="stat"><b id="exact">0</b>exact ZIP</div></div><div id="results"></div></div><script>const $=id=>document.getElementById(id);const HUBS={Stockton:['95202','95203','95204','95205','95206','95207','95209','95210','95212','95215'],Modesto:['95350','95351','95354','95355','95356','95357','95358'],Merced:['95340','95341','95344','95348'],Madera:['93636','93637','93638','93639'],Fresno:['93701','93702','93703','93704','93705','93706','93710','93711','93720','93721','93722','93725','93726','93727','93728','93730'],Visalia:['93277','93291','93292'],Hanford:['93230','93232'],Porterville:['93257','93258'],Bakersfield:['93301','93304','93305','93306','93307','93308','93309','93311','93312','93313','93314']};const DEFAULT={Stockton:'95202',Modesto:'95354',Merced:'95340',Madera:'93637',Fresno:'93721',Visalia:'93291',Hanford:'93230',Porterville:'93257',Bakersfield:'93301'};let active=null;try{const cs=JSON.parse(localStorage.getItem('vrhn_clients')||'[]'),id=localStorage.getItem('vrhn_current');active=cs.find(c=>c.id===id)||null}catch(e){}const initial=(active&&active.postalCode)||localStorage.getItem('vrhn_last_zip')||(active&&DEFAULT[active.city])||'93721';$('zip').value=initial;const sources=[{name:'HUD Multifamily',url:'https://egis.hud.gov/arcgis/rest/services/gotit/MultifamilyProperties/MapServer/0/query',fields:'PROPERTY_NAME_TEXT,STD_ADDR,STD_CITY,STD_ST,STD_ZIP5,TOTAL_UNIT_COUNT,PROPERTY_ON_SITE_PHONE_NUMBER,MGMT_AGENT_ORG_NAME,MGMT_CONTACT_MAIN_PHN_NBR,MGMT_CONTACT_EMAIL_TEXT',nameField:'PROPERTY_NAME_TEXT',units:'TOTAL_UNIT_COUNT'},{name:'Public Housing',url:'https://egis.hud.gov/arcgis/rest/services/gotit/PublicHousing/MapServer/2/query',fields:'PROJECT_NAME,STD_ADDR,STD_CITY,STD_ST,STD_ZIP5,TOTAL_UNITS,FORMAL_PARTICIPANT_NAME',nameField:'PROJECT_NAME',units:'TOTAL_UNITS'},{name:'LIHTC',url:'https://egis.hud.gov/arcgis/rest/services/gotit/LIHTCProperties/MapServer/0/query',fields:'PROJECT,STD_ADDR,STD_CITY,STD_ST,STD_ZIP5,N_UNITS,COMPANY,CONTACT,CO_TEL',nameField:'PROJECT',units:'N_UNITS'}];function uniq(a){return [...new Set(a)]}function clientZips(primary){if($('scope').value==='exact')return[primary];if($('scope').value==='all')return uniq(Object.values(HUBS).flat());let z=[primary];if(active&&HUBS[active.city])z.push(...HUBS[active.city]);const neighbors={Fresno:['Madera','Visalia','Hanford','Merced'],Bakersfield:['Porterville','Visalia'],Stockton:['Modesto'],Modesto:['Stockton','Merced'],Merced:['Modesto','Madera','Fresno'],Madera:['Fresno','Merced'],Visalia:['Hanford','Porterville','Fresno','Bakersfield'],Hanford:['Visalia','Fresno'],Porterville:['Visalia','Bakersfield']}[(active&&active.city)||'Fresno']||[];neighbors.forEach(c=>z.push(...(HUBS[c]||[])));return uniq(z).slice(0,45)}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function matchScore(a,primary){let s=55;if(a.STD_ZIP5===primary)s+=25;if(active){if((a.STD_CITY||'').toLowerCase()===(active.city||'').toLowerCase())s+=10;if(active.voucher&&active.voucher!=='none')s+=4;if(active.accessible==='yes')s+=2;if(active.household>1) s+=2}return Math.min(98,s)}async function querySource(s,zips){const clauses=zips.map(z=>`STD_ZIP5='${z}'`).join(' OR ');const p=new URLSearchParams({where:`(${clauses})`,outFields:s.fields,returnGeometry:'false',f:'json',resultRecordCount:'1000'});const r=await fetch(s.url+'?'+p);if(!r.ok)throw Error(s.name);const j=await r.json();if(j.error)throw Error(s.name);return (j.features||[]).map(f=>({s,a:f.attributes||{}}))}function render(r,primary){const a=r.a,n=a[r.s.nameField]||'Unnamed property',addr=[a.STD_ADDR,a.STD_CITY,a.STD_ST,a.STD_ZIP5].filter(Boolean).join(', '),phone=a.PROPERTY_ON_SITE_PHONE_NUMBER||a.MGMT_CONTACT_MAIN_PHN_NBR||a.CO_TEL||'',mgr=a.MGMT_AGENT_ORG_NAME||a.FORMAL_PARTICIPANT_NAME||a.COMPANY||'',units=a[r.s.units]||'';return `<div class="result"><span class="score">${matchScore(a,primary)}% match</span><b>${esc(n)}</b><div><span class="pill">${esc(r.s.name)}</span><span class="pill">ZIP ${esc(a.STD_ZIP5||'')}</span>${a.STD_ZIP5===primary?'<span class="pill">Primary ZIP</span>':''}${units?`<span class="pill">${esc(units)} units</span>`:''}</div><p class="small">${esc(addr)}</p>${mgr?`<div class="small"><b>Agency/manager:</b> ${esc(mgr)}</div>`:''}${phone?`<div class="small"><b>Phone:</b> <a href="tel:${esc(phone)}">${esc(phone)}</a></div>`:''}<a class="btnlink" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}">View area</a></div>`}async function run(){const primary=$('zip').value.trim();if(!/^\d{5}$/.test(primary)){ $('status').textContent='Enter a valid 5-digit ZIP.';return }localStorage.setItem('vrhn_last_zip',primary);const zips=clientZips(primary);$('status').textContent=`Searching ${zips.length} ZIP codes across free housing datasets…`;let all=[],errs=[];const sets=await Promise.allSettled(sources.map(s=>querySource(s,zips)));sets.forEach((x,i)=>x.status==='fulfilled'?all.push(...x.value):errs.push(sources[i].name));const seen=new Set();all=all.filter(r=>{const k=[r.s.name,r.a[r.s.nameField],r.a.STD_ADDR,r.a.STD_ZIP5].join('|');if(seen.has(k))return false;seen.add(k);return true});all.sort((x,y)=>matchScore(y.a,primary)-matchScore(x.a,primary));$('total').textContent=all.length;$('zips').textContent=zips.length;$('exact').textContent=all.filter(r=>r.a.STD_ZIP5===primary).length;$('results').innerHTML=all.slice(0,300).map(r=>render(r,primary)).join('')||'<p class="small">No connected government properties found. Try All San Joaquin Valley hubs.</p>';$('status').textContent=`Search complete: ${all.length} properties across ${zips.length} ZIP codes.${errs.length?' Some sources unavailable: '+errs.join(', '):''}`;localStorage.setItem('vrhn_last_search_at',Date.now())}$('run').onclick=run;$('zip').addEventListener('keydown',e=>{if(e.key==='Enter')run()});setTimeout(run,300);setInterval(()=>{if(!document.hidden)run()},1800000);</script></body></html>
